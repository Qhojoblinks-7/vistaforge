name: Lighthouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GRAPHQL_URL: ${{ secrets.VITE_GRAPHQL_URL }}

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_SERVER_BASE_URL: ${{ secrets.LHCI_SERVER_BASE_URL }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            const resultsDir = '.lighthouseci';
            if (!fs.existsSync(resultsDir)) {
              console.log('No Lighthouse results found');
              return;
            }
            
            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.json'));
            if (files.length === 0) {
              console.log('No Lighthouse JSON results found');
              return;
            }
            
            let comment = '## 🏃 Lighthouse CI Results\n\n';
            
            for (const file of files) {
              const content = fs.readFileSync(path.join(resultsDir, file), 'utf8');
              const result = JSON.content ? JSON.parse(content) : JSON.parse(content);
              
              const url = result.finalUrl || 'Unknown URL';
              const categories = result.categories || {};
              
              comment += `### ${url}\n\n`;
              comment += '| Category | Score |\n|----------|-------|\n';
              
              for (const [key, value] of Object.entries(categories)) {
                const score = value.score ? Math.round(value.score * 100) : 'N/A';
                const emoji = score >= 90 ? '✅' : score >= 50 ? '⚠️' : '❌';
                comment += `| ${key} | ${emoji} ${score} |\n`;
              }
              
              comment += '\n---\n\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });